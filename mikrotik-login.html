<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Redirecting...</title>
    <script>
        // Redirect to external splash page with MikroTik variables
        // CHANGE THIS URL to your GitHub Pages URL
        var splashUrl = "https://alamin-mahamud.github.io/captive-portal-poc/";

        // Build redirect URL with parameters
        var redirectUrl = splashUrl +
            "?link-login=" + encodeURIComponent("$(link-login-only)") +
            "&link-orig=" + encodeURIComponent("$(link-orig)") +
            "&mac=" + encodeURIComponent("$(mac)") +
            "&ip=" + encodeURIComponent("$(ip)") +
            "&username=" + encodeURIComponent("$(username)") +
            "&error=" + encodeURIComponent("$(error)");

        window.location.href = redirectUrl;
    </script>
</head>
<body>
    <noscript>
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript or click the button below:</p>
        <form method="get" action="https://alamin-mahamud.github.io/captive-portal-poc/">
            <input type="hidden" name="link-login" value="$(link-login-only)">
            <input type="hidden" name="link-orig" value="$(link-orig)">
            <input type="hidden" name="mac" value="$(mac)">
            <input type="hidden" name="ip" value="$(ip)">
            <input type="submit" value="Continue to Login">
        </form>
    </noscript>
    <p>Redirecting to login page...</p>
</body>
</html>
