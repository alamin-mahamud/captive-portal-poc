<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Connected - Poptar WiFi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #f59e0b;
            --success: #10b981;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-white);
            overflow: hidden;
        }

        .ios-success { position: absolute; left: -9999px; }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* Phase 1: Connected */
        .connected-phase {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .connected-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .connected-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .brand-badge .logo {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* Phase 2: Video Ad */
        .video-phase {
            display: none;
            width: 100%;
            max-width: 480px;
        }

        .ad-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            font-size: 24px;
            font-weight: 700;
        }

        .countdown-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-card);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            width: 0%;
            transition: width 0.1s linear;
        }

        .waiting-btn {
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: not-allowed;
        }

        /* Phase 3: Continue */
        .continue-phase {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .continue-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(16,185,129,0.4);
            transition: transform 0.2s;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
        }

        .skip-notice {
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <span class="ios-success">Success</span>

    <div class="container">
        <!-- Phase 1: Connected Message -->
        <div class="connected-phase" id="phase-connected">
            <div class="success-icon">✓</div>
            <h1 class="connected-title">You're Connected!</h1>
            <p class="connected-subtitle">Enjoy free internet with Poptar WiFi</p>
            <div class="brand-badge">
                Powered by <span class="logo">Poptar WiFi</span>
            </div>
        </div>

        <!-- Phase 2: Video Ad (5 seconds) -->
        <div class="video-phase" id="phase-video">
            <div class="ad-label">Advertisement</div>

            <div class="video-container" id="video-container">
                <iframe
                    id="yt-player"
                    src="https://www.youtube.com/embed/cO7w1ST8R4c?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&enablejsapi=1"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>

                <div class="countdown-overlay" id="countdown">
                    Ad ends in <span id="countdown-num">5</span>s
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <button class="waiting-btn" id="waiting-btn">
                Please wait... <span id="wait-seconds">5</span>s
            </button>
        </div>

        <!-- Phase 3: Continue -->
        <div class="continue-phase" id="phase-continue">
            <div class="success-icon">✓</div>
            <h1 class="connected-title">Ad Complete!</h1>
            <p class="connected-subtitle">You can now browse freely</p>

            <button class="continue-btn" onclick="continueBrowsing()">
                🌐 Continue Browsing
            </button>

            <p class="skip-notice">Auto-redirecting in 3 seconds...</p>
        </div>
    </div>

    <div class="footer">
        Poptar WiFi &copy; 2026
    </div>

    <script>
        var AD_DURATION = 5;
        var CONNECTED_DISPLAY_TIME = 2000;
        var countdown = AD_DURATION;
        var countdownInterval;

        console.log('IMPRESSION_STEP_02A: Post-connect splash');

        window.onload = function() {
            setTimeout(showVideoPhase, CONNECTED_DISPLAY_TIME);
        };

        function showVideoPhase() {
            document.getElementById('phase-connected').style.display = 'none';
            document.getElementById('phase-video').style.display = 'block';
            console.log('IMPRESSION_STEP_03: Video ad started');
            startCountdown();
        }

        function startCountdown() {
            updateProgress();
            countdownInterval = setInterval(function() {
                countdown--;
                updateProgress();
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    showContinuePhase();
                }
            }, 1000);
        }

        function updateProgress() {
            var progress = ((AD_DURATION - countdown) / AD_DURATION) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('countdown-num').textContent = countdown;
            document.getElementById('wait-seconds').textContent = countdown;
        }

        function showContinuePhase() {
            document.getElementById('phase-video').style.display = 'none';
            document.getElementById('phase-continue').style.display = 'flex';
            console.log('AD_COMPLETE: Video ad finished');
            setTimeout(continueBrowsing, 3000);
        }

        function continueBrowsing() {
            try { window.close(); } catch(e) {}
            var dst = new URLSearchParams(window.location.search).get('dst') || 'https://www.google.com';
            window.location.href = dst;
        }

        // Block back button during ad
        history.pushState(null, null, location.href);
        window.onpopstate = function() {
            if (countdown > 0) history.go(1);
        };
    </script>
</body>
</html>
