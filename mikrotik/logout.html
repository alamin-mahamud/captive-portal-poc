<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Session Ended - Kahf WiFi</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Manrope',sans-serif;background:#f8faf9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
        .card{background:#fff;border-radius:20px;padding:40px;max-width:400px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
        .icon{width:64px;height:64px;background:#fff3cd;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px}
        h1{font-size:22px;color:#111;margin-bottom:8px}
        p{font-size:14px;color:#6b7280;margin-bottom:24px}
        .btn{display:inline-block;padding:14px 32px;background:#00c851;color:#fff;text-decoration:none;border-radius:12px;font-weight:700;font-size:15px}
        .btn:hover{background:#00a844}
        .logo{margin-top:32px}
        .logo img{height:24px}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#8987;</div>
        <h1>Session Ended</h1>
        <p>Your WiFi session has expired. Click below to reconnect and continue enjoying safe internet.</p>
        <a href="$(link-login)" class="btn">Reconnect to WiFi</a>
        <div class="logo">
            <img src="https://dns.kahfguard.com/assets/images/kahfdns-logo.png" alt="Kahf">
        </div>
    </div>
</body>
</html>
