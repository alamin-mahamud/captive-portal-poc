<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahf Safe Internet - Free WiFi</title>
    <link rel="icon" href="https://dns.kahfguard.com/assets/images/kahfdns-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00c851;
            --primary-dark: #00a844;
            --primary-light: #e8f9ee;
            --primary-glow: rgba(0, 200, 81, 0.2);
            --bg-white: #ffffff;
            --bg-light: #f8faf9;
            --bg-dark: #111111;
            --text-dark: #111111;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --text-light: #ffffff;
            --border-light: #e5e7eb;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            padding: 16px 0;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo img {
            height: 22px;
            width: auto;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .main {
            flex: 1;
            padding: 24px 0;
        }

        .content {
            width: 100%;
            text-align: center;
        }

        /* Free WiFi Badge */
        .wifi-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .wifi-badge-icon {
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
        }

        /* Stats Bar - Prominent Display */
        .stats-section {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-item {
            text-align: center;
            padding: 12px 8px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }

        /* Ad Section */
        .ad-section {
            background: #000;
            border-radius: var(--radius-xl);
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .ad-video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .ad-video-container iframe,
        .ad-video-container #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .ad-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        /* Connect Section */
        .connect-section {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .connect-status {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 3px;
            transition: width 1s linear;
            width: 0%;
        }

        .countdown-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .countdown-text strong {
            color: var(--primary-dark);
            font-weight: 700;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 40px;
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: none;
            font-family: inherit;
            width: 100%;
            max-width: 320px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #00e676;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .btn-disabled {
            background: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .btn-disabled:hover {
            background: #e5e7eb;
            transform: none;
            box-shadow: none;
        }

        .terms {
            margin-top: 16px;
            font-size: 10px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .terms a {
            color: var(--primary-dark);
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }

        /* Powered By Section - Logo Only */
        .powered-section {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 20px;
        }

        .powered-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 20px;
        }

        .powered-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .powered-logo-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            background: #fff;
            border: 2px solid var(--border-light);
            border-radius: 20px;
            padding: 16px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .powered-logo-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .powered-logo-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Footer */
        .footer {
            background: var(--bg-dark);
            padding: 48px 24px;
            text-align: center;
        }

        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .footer-logo img {
            height: 20px;
            width: auto;
        }

        .footer-logo span {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-light);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .footer-link {
            font-size: 13px;
            color: #888888;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--primary);
        }

        .footer-text {
            font-size: 11px;
            color: #666666;
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
            }
            .stat-value {
                font-size: 20px;
            }
            .powered-logos {
                gap: 12px;
            }
            .powered-logo-card {
                width: 80px;
                height: 80px;
                padding: 12px;
                border-radius: 16px;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="https://kahf.com.tr" class="logo" target="_blank" rel="noopener noreferrer">
                <img src="https://dns.kahfguard.com/assets/images/kahfdns-logo.png" alt="Kahf">
                <span class="logo-text">Kahf</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <div class="content">
                <!-- Free WiFi Badge -->
                <div class="wifi-badge">
                    <span class="wifi-badge-icon">✓</span>
                    <span>Free WiFi Available</span>
                </div>

                <!-- Stats Section -->
                <div class="stats-section">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">1.6B+</div>
                            <div class="stat-label">Queries Blocked</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">8M+</div>
                            <div class="stat-label">Installs</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">2M+</div>
                            <div class="stat-label">Active Users</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">100K+</div>
                            <div class="stat-label">Reviews</div>
                        </div>
                    </div>
                </div>

                <!-- Ad Section -->
                <div class="ad-section">
                    <span class="ad-badge">Sponsor</span>
                    <div class="ad-video-container">
                        <div id="youtube-player"></div>
                    </div>
                </div>

                <!-- Connect Section -->
                <div class="connect-section">
                    <!-- Loading state -->
                    <div id="loading-state">
                        <div class="connect-status">Your free WiFi is loading...</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="countdown-text">
                            Available in <strong id="countdown">15</strong> seconds
                        </div>
                        <button type="button" class="btn btn-disabled" disabled>
                            Connect to Free WiFi
                        </button>
                    </div>

                    <!-- Ready state -->
                    <div id="ready-state" class="hidden">
                        <form id="login-form" method="post" action="">
                            <input type="hidden" name="username" value="guest">
                            <input type="hidden" name="password" value="guest">
                            <input type="hidden" name="dst" id="dst" value="">
                            <input type="hidden" name="popup" value="false">
                            <button type="submit" class="btn btn-primary">
                                Connect to Free WiFi
                            </button>
                        </form>
                    </div>

                    <p class="terms">
                        By connecting, you agree to our
                        <a href="https://kahf.com.tr/privacy-policy/" target="_blank">Privacy Policy</a>
                        &amp; <a href="https://kahf.com.tr/terms/" target="_blank">Terms of Service</a>
                    </p>
                </div>

                <!-- Powered By Section - Logos Only -->
                <div class="powered-section">
                    <div class="powered-title">Powered By</div>
                    <div class="powered-logos">
                        <a href="https://kahfbrowser.com" target="_blank" class="powered-logo-card">
                            <img src="https://dns.kahfguard.com/assets/images/kahf-browser-logo.svg" alt="Kahf Browser">
                        </a>
                        <a href="https://kahfguard.com" target="_blank" class="powered-logo-card">
                            <img src="https://dns.kahfguard.com/assets/images/kahf-guard-logo.svg" alt="KahfGuard">
                        </a>
                        <a href="https://kahfinternet.com" target="_blank" class="powered-logo-card">
                            <img src="https://dns.kahfguard.com/assets/images/kahf-internet-logo.svg" alt="Kahf Internet">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo">
            <img src="https://dns.kahfguard.com/assets/images/kahfdns-logo.png" alt="Kahf Inc.">
            <span>Kahf Inc.</span>
        </div>
        <div class="footer-links">
            <a href="https://kahf.com.tr" class="footer-link" target="_blank">Home</a>
            <a href="https://kahf.com.tr/contact/" class="footer-link" target="_blank">Contact</a>
            <a href="https://kahf.com.tr/privacy-policy/" class="footer-link" target="_blank">Privacy</a>
        </div>
        <p class="footer-text">Protected by Kahf Safe Internet</p>
    </footer>

    <!-- YouTube IFrame API -->
    <script>
        const AD_DURATION = 15;
        let countdown = AD_DURATION;
        let countdownInterval;
        let player;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: 'LaiN63o_BxA',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            startCountdown();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                enableConnect();
            }
        }

        function startCountdown() {
            updateProgress();
            countdownInterval = setInterval(function() {
                countdown--;
                updateProgress();
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    enableConnect();
                }
            }, 1000);
        }

        function updateProgress() {
            const progress = ((AD_DURATION - countdown) / AD_DURATION) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('countdown').textContent = Math.max(0, countdown);
        }

        function enableConnect() {
            clearInterval(countdownInterval);
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('ready-state').classList.remove('hidden');
        }

        const params = new URLSearchParams(window.location.search);
        const linkLogin = params.get('link-login') || params.get('link_login');
        const linkOrig = params.get('link-orig') || params.get('link_orig') || 'http://www.google.com/';

        const form = document.getElementById('login-form');
        if (linkLogin) {
            form.action = linkLogin;
        } else {
            form.action = 'http://192.168.50.1/login';
        }
        document.getElementById('dst').value = linkOrig;

        setTimeout(function() {
            if (!player) {
                startCountdown();
            }
        }, 3000);
    </script>
</body>
</html>
