<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahf Safe Internet - Free WiFi</title>
    <link rel="icon" href="https://dns.kahfguard.com/assets/images/kahfdns-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00c851;
            --primary-dark: #00a844;
            --primary-light: #e8f9ee;
            --bg-white: #ffffff;
            --bg-light: #f8faf9;
            --bg-dark: #111111;
            --text-dark: #111111;
            --text-muted: #6b7280;
            --border-light: #e5e7eb;
        }
        body {
            font-family: 'Manrope', -apple-system, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
            text-align: center;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo img { height: 22px; }
        .logo span { font-size: 18px; font-weight: 700; color: var(--text-dark); }
        .main {
            flex: 1;
            padding: 24px;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }
        .wifi-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .wifi-icon {
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 20px; font-weight: 800; color: var(--text-dark); }
        .stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
        .ad-section {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }
        .ad-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 10;
        }
        .ad-video {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
        }
        .ad-video #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .connect-box {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 1s linear;
        }
        .countdown {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .countdown strong { color: var(--primary-dark); }
        .btn {
            padding: 16px 40px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            font-family: inherit;
        }
        .btn-disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #00e676; color: #000; }
        .terms { font-size: 10px; color: var(--text-muted); margin-top: 16px; }
        .terms a { color: var(--primary-dark); text-decoration: none; }
        .hidden { display: none !important; }

        /* Powered By - Large Logos */
        .powered {
            text-align: center;
            margin-bottom: 20px;
        }
        .powered-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .powered-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .powered-logo {
            display: block;
            width: 250px;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .powered-logo:hover {
            transform: scale(1.02);
        }
        .powered-logo img {
            width: 100%;
            height: auto;
        }

        .footer {
            background: var(--bg-dark);
            padding: 40px 24px;
            text-align: center;
        }
        .footer-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .footer-logo img { height: 20px; }
        .footer-logo span { font-size: 16px; font-weight: 700; color: #fff; }
        .footer-links { margin-bottom: 8px; }
        .footer-links a { color: #888; font-size: 13px; text-decoration: none; margin: 0 12px; }
        .footer-links a:hover { color: var(--primary); }
        .footer-text { font-size: 11px; color: #666; }

        @media (max-width: 600px) {
            .powered-logo { width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="https://kahf.com.tr" class="logo" target="_blank">
            <img src="https://dns.kahfguard.com/assets/images/kahfdns-logo.png" alt="Kahf">
            <span>Kahf</span>
        </a>
    </header>

    <main class="main" style="text-align:center;">
        <div class="wifi-badge">
            <span class="wifi-icon">✓</span>
            Free WiFi Available
        </div>

        <div class="stats">
            <div class="stat"><div class="stat-value">1.6B+</div><div class="stat-label">Blocked</div></div>
            <div class="stat"><div class="stat-value">8M+</div><div class="stat-label">Installs</div></div>
            <div class="stat"><div class="stat-value">2M+</div><div class="stat-label">Users</div></div>
            <div class="stat"><div class="stat-value">100K+</div><div class="stat-label">Reviews</div></div>
        </div>

        <div class="ad-section">
            <span class="ad-badge">Sponsor</span>
            <div class="ad-video"><div id="youtube-player"></div></div>
        </div>

        <div class="connect-box">
            <div id="loading-state">
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="countdown">Available in <strong id="countdown">15</strong>s</div>
                <button class="btn btn-disabled" disabled>Connect to Free WiFi</button>
            </div>
            <div id="ready-state" class="hidden">
                <form id="login-form" method="post" action="">
                    <input type="hidden" name="username" value="guest">
                    <input type="hidden" name="password" value="guest">
                    <input type="hidden" name="dst" id="dst" value="">
                    <input type="hidden" name="popup" value="false">
                    <button type="submit" class="btn btn-primary">Connect to Free WiFi</button>
                </form>
            </div>
            <p class="terms">By connecting, you agree to our <a href="https://kahf.com.tr/privacy-policy/" target="_blank">Privacy Policy</a></p>
        </div>

        <div class="powered">
            <div class="powered-title">Powered By</div>
            <div class="powered-logos">
                <a href="https://kahfbrowser.com" target="_blank" class="powered-logo">
                    <img src="https://dns.kahfguard.com/assets/images/kahf-browser-logo.svg" alt="Kahf Browser">
                </a>
                <a href="https://kahfguard.com" target="_blank" class="powered-logo">
                    <img src="https://dns.kahfguard.com/assets/images/kahf-guard-logo.svg" alt="KahfGuard">
                </a>
                <a href="https://kahfinternet.com" target="_blank" class="powered-logo">
                    <img src="https://dns.kahfguard.com/assets/images/kahf-internet-logo.svg" alt="Kahf Internet">
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-logo">
            <img src="https://dns.kahfguard.com/assets/images/kahfdns-logo.png" alt="Kahf">
            <span>Kahf Inc.</span>
        </div>
        <div class="footer-links">
            <a href="https://kahf.com.tr" target="_blank">Home</a>
            <a href="https://kahf.com.tr/contact/" target="_blank">Contact</a>
            <a href="https://kahf.com.tr/privacy-policy/" target="_blank">Privacy</a>
        </div>
        <p class="footer-text">Protected by Kahf Safe Internet</p>
    </footer>

    <script>
        const AD_DURATION = 15;
        let countdown = AD_DURATION, countdownInterval, player;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: 'LaiN63o_BxA',
                playerVars: { autoplay:1, mute:1, controls:1, rel:0, modestbranding:1, playsinline:1 },
                events: { onReady: e => { e.target.playVideo(); startCountdown(); }, onStateChange: e => { if(e.data === YT.PlayerState.ENDED) enableConnect(); } }
            });
        }

        function startCountdown() {
            updateProgress();
            countdownInterval = setInterval(() => {
                countdown--;
                updateProgress();
                if (countdown <= 0) { clearInterval(countdownInterval); enableConnect(); }
            }, 1000);
        }

        function updateProgress() {
            document.getElementById('progress-fill').style.width = ((AD_DURATION - countdown) / AD_DURATION * 100) + '%';
            document.getElementById('countdown').textContent = Math.max(0, countdown);
        }

        function enableConnect() {
            clearInterval(countdownInterval);
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('ready-state').classList.remove('hidden');
        }

        const params = new URLSearchParams(window.location.search);
        const form = document.getElementById('login-form');
        form.action = params.get('link-login') || params.get('link_login') || 'http://192.168.50.1/login';
        document.getElementById('dst').value = params.get('link-orig') || params.get('link_orig') || 'http://www.google.com/';

        setTimeout(() => { if (!player) startCountdown(); }, 3000);
    </script>
</body>
</html>
