<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected - Poptar Wifi</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,sans-serif;background:#3B82F6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
        .icon{width:64px;height:64px;margin-bottom:16px}
        .icon svg{width:100%;height:100%;stroke:#fff;stroke-width:2;fill:none}
        h1{font-size:20px;margin-bottom:8px}
        p{font-size:14px;opacity:0.9;margin-bottom:20px}
        .btn{padding:12px 28px;font-size:14px;font-weight:600;color:#3B82F6;background:#fff;border:none;border-radius:8px;cursor:pointer}
        .ios-trigger{position:absolute;left:-9999px}
    </style>
</head>
<body>
    <span class="ios-trigger">Success</span>
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>সফলভাবে সংযুক্ত!</h1>
    <p>Poptar WiFi-এ স্বাগতম</p>
    <button class="btn" onclick="go()">ব্রাউজিং শুরু করুন</button>
    <script>
    var dst='$(link-orig-esc)';if(!dst||dst==='$(link-orig-esc)')dst='https://www.google.com';
    function go(){try{window.close()}catch(e){}setTimeout(function(){location.href=dst},200)}
    setTimeout(function(){try{window.close()}catch(e){}},1500);
    setTimeout(function(){location.href=dst},3000);
    </script>
</body>
</html>
