<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <!-- Google Fonts - Noto Sans Bengali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Connected - Poptar Wifi</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            /* Brand Colors */
            --primary:#2858F5;
            --primary-dark:#0B39CF;
            --accent:#FFD700;
            --white:#FFFFFF;
            --bg:#F5F5F5;
            --gradient:linear-gradient(180deg, #2858F5 0%, #0B39CF 100%);

            /* Text Colors */
            --text-dark:#1F2937;
            --text-body:#374151;
            --text-muted:#6B7280;
            --text-light:#9CA3AF;

            /* UI Colors */
            --border:#E5E7EB;
            --success:#10B981;
            --error:#EF4444;
            --button-primary:#8B93A8;
            --button-hover:#7A8296;

            /* Spacing Scale */
            --space-xs:4px;
            --space-sm:8px;
            --space-md:12px;
            --space-lg:16px;
            --space-xl:20px;
            --space-2xl:24px;
            --space-3xl:32px;

            /* Border Radius */
            --radius-sm:6px;
            --radius-md:10px;
            --radius-lg:12px;
            --radius-xl:16px;
            --radius-full:9999px;

            /* Shadows */
            --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
            --shadow-md:0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg:0 4px 12px rgba(0,0,0,0.1)
        }
        html,body{height:100%;font-family:'Noto Sans Bengali',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{background:var(--gradient);min-height:100vh;color:var(--white)}

        .ios-trigger{position:absolute;left:-9999px}

        /* Phase 1 */
        .phase1{display:flex;flex-direction:column;min-height:100vh;max-height:100vh;padding:0 var(--space-lg) var(--space-xl);overflow:hidden}
        .phase1.hidden{display:none}

        .header{padding:var(--space-2xl) var(--space-lg);text-align:center;flex-shrink:0}
        .header h1{font-size:28px;font-weight:800;line-height:32px;letter-spacing:0.0703125px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        .header h1 .wifi-text{color:var(--accent)}

        .success-section{text-align:center;padding:var(--space-2xl) 0;flex-shrink:0}
        .success-icon{width:64px;height:64px;margin:0 auto var(--space-md)}
        .success-title{font-size:24px;font-weight:500;margin-bottom:var(--space-sm);line-height:1.3}
        .success-sub{font-size:15px;opacity:0.9;line-height:1.5}

        .countdown{width:48px;height:48px;border-radius:var(--radius-full);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;margin:var(--space-lg) auto;font-size:20px;font-weight:700;box-shadow:var(--shadow-md);flex-shrink:0}

        /* Ad Container - Carousel */
        .ad-container{position:relative;background:var(--white);overflow:hidden;box-shadow:var(--shadow-lg);margin:var(--space-lg) 0;border-radius:var(--radius-lg);max-width:440px;min-height:0;max-height:400px}
        .ad-loading{padding:var(--space-2xl) var(--space-lg);text-align:center;color:var(--text-muted);font-size:13px;font-family:'Noto Sans Bengali',sans-serif}
        .ad-loading::after{content:'';display:block;width:24px;height:24px;margin:var(--space-md) auto 0;border:2px solid var(--border);border-top-color:var(--primary);border-radius:var(--radius-full);animation:spin 0.7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Ad Card */
        .ad-card{opacity:0;position:absolute;top:0;left:0;width:100%;text-decoration:none;color:inherit;border-radius:var(--radius-lg);pointer-events:none;transition:opacity 0.4s ease-in-out}
        .ad-card.active{opacity:1;position:relative;pointer-events:auto;animation:fadeInSlide 0.4s ease-out}
        .ad-badge{position:absolute;top:var(--space-sm);right:var(--space-sm);background:rgba(0,0,0,0.6);color:var(--white);padding:4px 8px;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;border-radius:3px;font-weight:600;z-index:1}
        .ad-image{width:100%;height:200px;object-fit:cover;background:var(--bg);display:block;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
        .ad-body{padding:var(--space-md) var(--space-lg);background:var(--white);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
        .ad-header{display:flex;align-items:center;gap:var(--space-sm)}
        .ad-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--bg);flex-shrink:0}
        .ad-brand{flex:1;min-width:0}
        .ad-title{font-size:15px;font-weight:700;line-height:1.3;color:var(--text-dark);margin-bottom:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .ad-sponsor{font-size:11px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .ad-desc{display:none}
        .ad-cta{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:var(--white);padding:8px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:600;text-align:center;transition:background 0.2s;text-decoration:none;flex-shrink:0;white-space:nowrap}
        .ad-cta:active{background:var(--primary-dark);transform:scale(0.97)}

        /* Fallback Ad */
        .ad-fallback{padding:var(--space-2xl) var(--space-lg);text-align:center}
        .ad-fallback-icon{font-size:36px;margin-bottom:var(--space-sm)}
        .ad-fallback-title{font-size:15px;font-weight:600;margin-bottom:var(--space-xs);color:var(--text-dark)}
        .ad-fallback-desc{font-size:12px;color:var(--text-muted)}

        /* Carousel Dots */
        .dots{display:flex;justify-content:center;gap:var(--space-sm);padding:var(--space-lg) 0;flex-shrink:0}
        .dot{width:28px;height:4px;border-radius:var(--radius-sm);background:var(--white);opacity:0.4;cursor:pointer;transition:all 0.3s}
        .dot.active{opacity:1;width:32px}

        .btn{width:100%;margin-top:var(--space-lg);padding:var(--space-lg) var(--space-xl);font-size:14px;font-weight:500;line-height:20px;letter-spacing:-0.265174px;border-radius:var(--radius-md);border:none;cursor:pointer;font-family:'Noto Sans Bengali',sans-serif;background:var(--white);color:var(--primary);transition:all 0.2s;min-height:52px;box-shadow:var(--shadow-md);flex-shrink:0}
        .btn:disabled{opacity:0.6;cursor:not-allowed}
        .btn:active:not(:disabled){transform:scale(0.98)}

        /* Phase 2 - Full Page Ad */
        .phase2{display:none;position:fixed;inset:0;background:var(--gradient);flex-direction:column;z-index:100}
        .phase2.active{display:flex}

        .phase2-header{display:flex;justify-content:space-between;align-items:center;padding:var(--space-lg) var(--space-xl)}
        .phase2-badge{font-size:11px;opacity:0.8;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
        .phase2-timer{width:40px;height:40px;border-radius:var(--radius-full);background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;box-shadow:var(--shadow-md)}

        .phase2-content{flex:1;display:flex;flex-direction:column;padding:0 var(--space-lg) var(--space-2xl)}
        .phase2-image{flex:1;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-xl);background:rgba(255,255,255,0.1);box-shadow:var(--shadow-lg)}
        .phase2-image img{width:100%;height:100%;object-fit:contain}
        .phase2-info{text-align:center}
        .phase2-title{font-size:22px;font-weight:700;margin-bottom:var(--space-md);line-height:1.3}
        .phase2-desc{font-size:15px;opacity:0.9;line-height:1.5}

        .phase2-footer{text-align:center;padding:var(--space-lg);font-size:11px;opacity:0.6}

        /* Transitions & Animations */
        @keyframes fadeInSlide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
        .btn,.ad-cta,.dot{transition:all 0.2s ease}
        .ad-cta:hover{transform:translateY(-1px)}
        .dot{transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1)}

        /* Touch targets - ensure minimum 44x44px */
        @media(pointer:coarse){
            .btn{min-height:48px;padding:var(--space-lg) var(--space-xl)}
            .countdown{width:52px;height:52px;font-size:22px}
            .phase2-timer{width:44px;height:44px;font-size:18px}
            .dot{width:32px;height:10px;min-width:32px}
        }

        /* Responsive */
        @media(max-width:360px){
            .phase1{padding:0 var(--space-md) var(--space-lg)}
            .header{padding:var(--space-lg) var(--space-md)}
            .header h1{font-size:24px;line-height:28px}
            .success-section{padding:var(--space-lg) 0}
            .success-title{font-size:20px}
            .success-sub{font-size:14px}
            .success-icon{width:56px;height:56px}
            .ad-image{height:160px}
            .ad-container{width:100%;max-height:300px}
            .ad-body{padding:10px 12px}
            .ad-logo{width:28px;height:28px}
            .ad-title{font-size:13px}
            .ad-sponsor{font-size:10px}
            .ad-cta{font-size:11px;padding:6px 12px}
            .btn{font-size:13px;margin-top:var(--space-md)}
            .phase2-title{font-size:20px}
            .phase2-desc{font-size:14px}
        }
        @media(min-width:361px) and (max-width:480px){
            .ad-image{height:180px}
            .ad-body{padding:12px 14px}
            .ad-logo{width:32px;height:32px}
            .ad-title{font-size:14px}
            .ad-cta{font-size:12px;padding:7px 14px}
        }
        @media(min-width:481px){
            .phase1,.phase2-content{max-width:440px;margin-left:auto;margin-right:auto}
            .ad-image{height:220px}
        }

        /* Short viewport height - ensure button visibility */
        @media(max-height:700px){
            .header{padding:var(--space-lg) var(--space-lg)}
            .success-section{padding:var(--space-lg) 0}
            .success-icon{width:56px;height:56px}
            .countdown{width:44px;height:44px;font-size:18px;margin:var(--space-md) auto}
            .ad-container{max-height:280px}
            .ad-image{height:160px}
            .btn{margin-top:var(--space-md)}
        }

        @media(max-height:600px){
            .header{padding:var(--space-md) var(--space-lg)}
            .success-section{padding:var(--space-md) 0}
            .success-icon{width:48px;height:48px}
            .success-title{font-size:20px}
            .countdown{width:40px;height:40px;font-size:16px}
            .ad-container{max-height:220px}
            .ad-image{height:140px}
            .dots{padding:var(--space-sm) 0}
        }

        /* Safe area insets for notched devices */
        @supports(padding:env(safe-area-inset-bottom)){
            body{padding-bottom:env(safe-area-inset-bottom)}
            .phase1{padding-bottom:calc(var(--space-xl) + env(safe-area-inset-bottom))}
            .phase2-content{padding-bottom:calc(var(--space-2xl) + env(safe-area-inset-bottom))}
        }
    </style>
</head>

    <script>
    (function() {
        'use strict';

        // ============================================
        // CONFIGURATION
        // ============================================

            // KahfAds Native API

            // Timeouts
            adTimeout: 4000,
            beaconTimeout: 2000,

            // Number of ads to fetch
            maxAds: 3,

            // Carousel rotation interval (3 seconds)

            // Phase durations
            phase1Duration: 5,
            phase2Duration: 5,
            // Static fallback ads (cached from KahfAds API)

                {

        // ============================================

        var state = {
            ads: [],
            currentIndex: 0,
            impressionsFired: {},
            rotationTimer: null
        };

        // Destination URL
        var destination = '$(link-orig-esc)';

        // ============================================

        // ============================================
        var $adContainer = document.getElementById('ad-container');
        var $adLoading = document.getElementById('ad-loading');

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        function safeJsonParse(str) {
            try {
                return JSON.parse(str);
            } catch (e) {
                return null;
            }
        }

        function fireBeacon(url, timeout) {
            if (!url) return Promise.resolve();
            timeout = timeout || CONFIG.beaconTimeout;

            return new Promise(function(resolve) {
                var img = new Image();
                var resolved = false;

                function done() {
                    if (!resolved) {
                        resolved = true;
                        resolve();
                    }
                }

                img.onload = done;
                img.onerror = done;
                setTimeout(done, timeout);

                var separator = url.indexOf('?') > -1 ? '&' : '?';
                img.src = url + separator + '_cb=' + Date.now();
            });
        }

        function fetchWithTimeout(url, options, timeout) {
            timeout = timeout || CONFIG.adTimeout;
            options = options || {};

            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                var timeoutId;

                xhr.open(options.method || 'GET', url, true);

                if (options.headers) {
                    Object.keys(options.headers).forEach(function(key) {
                        xhr.setRequestHeader(key, options.headers[key]);
                    });
                }

                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        clearTimeout(timeoutId);
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve({
                                ok: true,
                                status: xhr.status,
                                json: function() {
                                    return Promise.resolve(safeJsonParse(xhr.responseText));
                                },
                                text: function() {
                                    return Promise.resolve(xhr.responseText);
                                }
                            });
                        } else {
                            reject(new Error('HTTP ' + xhr.status));
                        }
                    }
                };

                xhr.onerror = function() {
                    clearTimeout(timeoutId);
                    reject(new Error('Network error'));
                };

                timeoutId = setTimeout(function() {
                    xhr.abort();
                    reject(new Error('Timeout'));
                }, timeout);

                xhr.send(options.body || null);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================
        // AD FETCHING
        // ============================================

        function transformKahfAd(data) {
            if (!data || !data.title) return null;

            var impressionUrl = '';
            if (data.beacons && data.beacons.length > 0) {
                for (var i = 0; i < data.beacons.length; i++) {
                    if (data.beacons[i].type === 'impression') {
                        impressionUrl = data.beacons[i].url;
                        break;
                    }
                }
            }

            return {
                id: String(data.bannerId || Date.now()),
                title: data.title || '',
                description: data.description || '',
                imageUrl: (data.images && data.images[0]) ? data.images[0].url : '',
                iconUrl: (data.icons && data.icons[0]) ? data.icons[0].url : '',
                clickUrl: data.clickUrl || '#',
                impressionUrl: impressionUrl,
                ctaText: data.ctaText || 'Learn More',
                advertiser: data.advertiser || ''
            };
        }

        function fetchSingleAd() {
            return fetchWithTimeout(CONFIG.adEndpoint, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            }, CONFIG.adTimeout)
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                return transformKahfAd(data);
            })
            .catch(function(error) {
                console.warn('[AdFetch] Error:', error.message);
                return null;
            });
        }

        function fetchAds() {
            var promises = [];
            for (var i = 0; i < CONFIG.maxAds; i++) {
                promises.push(fetchSingleAd());
            }

            return Promise.all(promises).then(function(results) {
                var ads = [];
                var seenIds = {};
                results.forEach(function(ad) {
                    if (ad && !seenIds[ad.id]) {
                        seenIds[ad.id] = true;
                        ads.push(ad);
                    }
                });
                return ads;
            });
        }

        // ============================================
        // AD RENDERING
        // ============================================

        function renderAdCard(ad, index) {
            var isActive = index === 0 ? ' active' : '';
            var html = '';

            html += '<div class="ad-card' + isActive + '" ';
            html += 'data-ad-id="' + escapeHtml(ad.id) + '" ';
            html += 'data-index="' + index + '">';

            html += '<div style="position:relative;">';
            html += '<img class="ad-image" ';
            html += 'src="' + escapeHtml(ad.imageUrl) + '" ';
            html += 'alt="' + escapeHtml(ad.title) + '" ';
            html += 'loading="lazy" ';
            html += 'onerror="this.style.display=\'none\'">';
            html += '<div class="ad-badge">AD</div>';
            html += '</div>';

            html += '<div class="ad-body">';
            html += '<div class="ad-header">';
            if (ad.iconUrl) {
                html += '<img class="ad-logo" ';
                html += 'src="' + escapeHtml(ad.iconUrl) + '" ';
                html += 'alt="' + escapeHtml(ad.title) + ' logo" ';
                html += 'onerror="this.style.display=\'none\'">';
            }
            html += '<div class="ad-brand">';
            html += '<div class="ad-title">' + escapeHtml(ad.title) + '</div>';
            html += '<div class="ad-sponsor">Sponsored | ' + escapeHtml(ad.advertiser || ad.title) + '</div>';
            html += '</div>';

            html += '<a href="' + escapeHtml(ad.clickUrl) + '" ';
            html += 'target="_blank" rel="noopener" ';
            html += 'class="ad-cta" ';
            html += 'onclick="return handleAdClick(this, event, \'' + escapeHtml(ad.id) + '\')">';
            html += escapeHtml(ad.ctaText || 'Learn More');
            html += '</a>';

            html += '</div>';
            html += '</div>';
            html += '</div>';

            return html;
        }

        function renderFallbackAd() {
            // Randomly select a static ad
            var randomIndex = Math.floor(Math.random() * CONFIG.staticAds.length);
            var staticAd = CONFIG.staticAds[randomIndex];
            
            var html = '<div class="ad-card active">';
            if (staticAd.imageUrl) {
                html += '<div class="ad-image-wrapper">';
                html += '<img src="' + escapeHtml(staticAd.imageUrl) + '" alt="' + escapeHtml(staticAd.title) + '" class="ad-image" onerror="this.style.display=\'none\'">';
                html += '</div>';
            }
            html += '<div class="ad-content">';
            html += '<h3 class="ad-title">' + escapeHtml(staticAd.title) + '</h3>';
            html += '<p class="ad-description">' + escapeHtml(staticAd.description) + '</p>';
            html += '</div>';
            html += '</div>';
            return html;
        }

        function renderDots(count) {
            if (count <= 1) {
                $dots.style.display = 'none';
                return;
            }

            var html = '';
            for (var i = 0; i < count; i++) {
                html += '<span class="dot' + (i === 0 ? ' active' : '') + '" data-index="' + i + '"></span>';
            }
            $dots.innerHTML = html;
            $dots.style.display = 'flex';

            var dots = $dots.querySelectorAll('.dot');
            for (var j = 0; j < dots.length; j++) {
                dots[j].addEventListener('click', function() {
                    showAd(parseInt(this.getAttribute('data-index'), 10));
                });
            }
        }

        function showAd(index) {
            if (state.ads.length === 0) return;

            state.currentIndex = index;

            var cards = $adContainer.querySelectorAll('.ad-card');
            for (var i = 0; i < cards.length; i++) {
                if (i === index) {
                    cards[i].classList.add('active');
                } else {
                    cards[i].classList.remove('active');
                }
            }

            var dots = $dots.querySelectorAll('.dot');
            for (var j = 0; j < dots.length; j++) {
                if (j === index) {
                    dots[j].classList.add('active');
                } else {
                    dots[j].classList.remove('active');
                }
            }

            fireImpressionBeacon(state.ads[index]);
        }

        function rotateAd() {
            var nextIndex = (state.currentIndex + 1) % state.ads.length;
            showAd(nextIndex);
        }

        function startRotation() {
            if (state.ads.length <= 1) return;
            state.rotationTimer = setInterval(rotateAd, CONFIG.rotationInterval);
        }

        function stopRotation() {
            if (state.rotationTimer) {
                clearInterval(state.rotationTimer);
                state.rotationTimer = null;
            }
        }

        // ============================================
        // IMPRESSION TRACKING
        // ============================================

        function fireImpressionBeacon(ad) {
            if (!ad || !ad.id) return;

            if (state.impressionsFired[ad.id]) {
                return;
            }

            state.impressionsFired[ad.id] = true;

            if (ad.impressionUrl) {
                fireBeacon(ad.impressionUrl).then(function() {
                    console.log('[Impression] Fired for ad:', ad.id);
                });
            }
        }

        // ============================================
        // CLICK HANDLING
        // ============================================

        window.handleAdClick = function(element, event, adId) {
            var id = adId || element.getAttribute('data-ad-id');
            console.log('[Click] Ad clicked:', id);
            return true;
        };

        // ============================================
        // CAROUSEL INITIALIZATION
        // ============================================

        function initCarousel() {
            console.log('[Carousel] Initializing...');

            fetchAds()
                .then(function(ads) {
                    $adLoading.style.display = 'none';

                    if (ads.length === 0) {
                        $adContainer.innerHTML = renderFallbackAd();
                        $dots.style.display = 'none';
                        console.log('[Carousel] Showing fallback ad');
                        return;
                    }

                    state.ads = ads;

                    var html = '';
                    for (var i = 0; i < ads.length; i++) {
                        html += renderAdCard(ads[i], i);
                    }
                    $adContainer.innerHTML = html;

                    renderDots(ads.length);

                    fireImpressionBeacon(ads[0]);

                    startRotation();

                    console.log('[Carousel] Loaded', ads.length, 'ads');
                })
                .catch(function(error) {
                    console.error('[Carousel] Fatal error:', error);
                    $adLoading.style.display = 'none';
                    $adContainer.innerHTML = renderFallbackAd();
                });
        }

        // ============================================
        // PHASE 1 & 2 LOGIC
        // ============================================

        // Phase 1 countdown
        var count1 = CONFIG.phase1Duration;
        var timer1 = setInterval(function() {
            count1--;
            document.getElementById('countdown1').textContent = count1;
            if (count1 <= 0) {
                clearInterval(timer1);
                document.getElementById('countdown1').textContent = '✓';
                document.getElementById('success-sub').textContent = 'Poptar WiFi-এ স্বাগতম';
                document.getElementById('btn1').disabled = false;
            }
        }, 1000);

        // Button click - go to phase 2
        document.getElementById('btn1').onclick = function() {
            document.getElementById('phase1').classList.add('hidden');
            document.getElementById('phase2').classList.add('active');

            // Stop carousel rotation
            stopRotation();

            // Set phase 2 content (use current ad from carousel)
            if (state.ads.length > 0) {
                var currentAd = state.ads[state.currentIndex];
                document.getElementById('phase2-title').textContent = currentAd.title || 'Poptar WiFi';
                document.getElementById('phase2-desc').textContent = currentAd.description || '';
                if (currentAd.imageUrl) {
                    document.getElementById('phase2-img').src = currentAd.imageUrl;
                }
            }

            // Start phase 2 countdown
            var count2 = CONFIG.phase2Duration;
            var timer2 = setInterval(function() {
                count2--;
                document.getElementById('countdown2').textContent = count2;
                if (count2 <= 0) {
                    clearInterval(timer2);
                    document.getElementById('countdown2').textContent = '✓';
                    setTimeout(closePage, 500);
                }
            }, 1000);
        };

        function closePage() {
            // Multiple methods to close Android captive portal
            try { window.close(); } catch(e) {}
            try { window.open('', '_self', '').close(); } catch(e) {}

            // Show close message as fallback
            setTimeout(function() {
                document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px;background:#3B82F6;color:white;font-family:sans-serif"><div style="font-size:48px;margin-bottom:16px">✓</div><h2 style="margin-bottom:8px">সংযুক্ত হয়েছে</h2><p style="opacity:0.8;font-size:14px">আপনি এই উইন্ডো বন্ধ করতে পারেন</p></div>';
                // Try closing again after showing message
                setTimeout(function() {
                    try { window.close(); } catch(e) {}
                }, 1000);
            }, 500);
        }

        // ============================================
        // START
        // ============================================

        initCarousel();


    })();
    </script>
</body>
</html>
