<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <!-- Preconnect to ad resources for faster loading -->
    <link rel="preconnect" href="https://your-ad-proxy.example.com">
    <link rel="dns-prefetch" href="https://your-ad-proxy.example.com">
    <!-- Google Fonts - Noto Sans Bengali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Poptar Wifi - Free Internet</title>
    <style>
        /* ============================================
           CRITICAL CSS - INLINE FOR FAST FIRST PAINT
           ============================================ */
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            /* Brand Colors */
            --primary:#2858F5;
            --primary-dark:#0B39CF;
            --accent:#FFD700;
            --white:#FFFFFF;
            --bg:#F5F5F5;
            --gradient:linear-gradient(180deg, #2858F5 0%, #0B39CF 100%);

            /* Text Colors */
            --text-dark:#1F2937;
            --text-body:#374151;
            --text-muted:#6B7280;
            --text-light:#9CA3AF;

            /* UI Colors */
            --border:#E5E7EB;
            --success:#10B981;
            --error:#EF4444;
            --button-primary:#8B93A8;
            --button-hover:#7A8296;

            /* Spacing Scale */
            --space-xs:4px;
            --space-sm:8px;
            --space-md:12px;
            --space-lg:16px;
            --space-xl:20px;
            --space-2xl:24px;
            --space-3xl:32px;

            /* Border Radius */
            --radius-sm:6px;
            --radius-md:10px;
            --radius-lg:12px;
            --radius-xl:16px;
            --radius-full:9999px;

            /* Shadows */
            --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
            --shadow-md:0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg:0 4px 12px rgba(0,0,0,0.1)
        }
        html,body{height:100%;font-family:'Noto Sans Bengali',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
        body{background:var(--bg);display:flex;flex-direction:column;min-height:100vh;color:var(--text-body)}
        .top-section{background:var(--primary);padding-bottom: 5rem;}
        /* Header */
        .header{background:var(--primary);padding:var(--space-2xl) var(--space-lg);text-align:center}
        .header h1{color:var(--white);font-size:28px;font-weight:800;line-height:32px;letter-spacing:0.0703125px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        .header h1 .wifi-text{color:var(--accent)}

        /* Hero */
        .hero{background:var(--primary);padding:var(--space-2xl) var(--space-lg) var(--space-3xl);text-align:center;color:var(--white)}
        .hero-title{font-size:28px;font-weight:500;margin-bottom:var(--space-md);line-height:32px;letter-spacing:0.0703125px;font-family:'Noto Sans Bengali',sans-serif}
        .hero-sub{font-size:16px;font-weight:400;line-height:24px;letter-spacing:-0.3125px;color:#DBEAFE;max-width:393px;margin:0 auto;font-family:'Noto Sans Bengali',sans-serif}

        /* Main */
        .main{flex:1;}

        /* Ad Container */
        .ad-container{background:var(--white);overflow:hidden;box-shadow:var(--shadow-md);margin-bottom:var(--space-md)}
        .ad-loading{padding:var(--space-3xl) var(--space-xl);text-align:center;color:var(--text-muted);font-size:14px;font-family:'Noto Sans Bengali',sans-serif}
        .ad-loading::after{content:'';display:block;width:28px;height:28px;margin:var(--space-md) auto 0;border:3px solid var(--border);border-top-color:var(--primary);border-radius:var(--radius-full);animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Ad Card */
        .ad-card{display:none;text-decoration:none;color:inherit;position:relative}
        .ad-card.active{display:block}
        .ad-badge{position:absolute;top:var(--space-sm);right:var(--space-sm);background:rgba(255,255,255,0.95);padding:var(--space-xs) var(--space-sm);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.3px;border-radius:var(--radius-sm);backdrop-filter:blur(4px);font-weight:500;z-index:1}
        .ad-image{width:100%;height:220px;object-fit:cover;background:var(--bg);display:block}
        .ad-body{padding:var(--space-lg);background:var(--white)}
        .ad-header{display:flex;align-items:center;gap:var(--space-md);margin-bottom:var(--space-md)}
        .ad-logo{width:40px;height:40px;border-radius:var(--radius-sm);object-fit:cover;background:var(--bg);flex-shrink:0}
        .ad-brand{flex:1}
        .ad-title{font-size:16px;font-weight:700;margin-bottom:2px;line-height:1.3;color:var(--text-dark)}
        .ad-sponsor{font-size:12px;color:var(--text-muted)}
        .ad-desc{font-size:13px;color:var(--text-body);line-height:1.5;margin-bottom:var(--space-lg)}
        .ad-cta{display:block;width:100%;background:var(--primary);color:var(--white);padding:var(--space-md) var(--space-xl);border-radius:var(--radius-md);font-size:14px;font-weight:600;text-align:center;transition:background 0.2s}
        .ad-cta:active{background:var(--primary-dark)}

        /* Fallback Ad */
        .ad-fallback{padding:20px;text-align:center}
        .ad-fallback-icon{font-size:32px;margin-bottom:8px}
        .ad-fallback-title{font-size:14px;font-weight:600;margin-bottom:4px}
        .ad-fallback-desc{font-size:12px;color:var(--muted)}

        /* Carousel Dots */
        .dots{display:flex;justify-content:center;gap:var(--space-sm);margin-bottom:var(--space-lg);padding:var(--space-md) 0}
        .dot{width:28px;height:4px;border-radius:var(--radius-sm);background:var(--primary);opacity:0.25;cursor:pointer;transition:all 0.3s}
        .dot.active{opacity:1;width:32px}

        /* Security Notice */
        .security-notice{display:flex;align-items:center;justify-content:center;gap:var(--space-sm);padding:var(--space-lg) var(--space-md);color:var(--text-muted);font-size:13px;line-height:1.4}
        .shield-icon{width:20px;height:20px;color:var(--success);flex-shrink:0}

        /* Form */
        .form-card{background:var(--white);width:90%;max-width:416px;margin:0 auto;transform:translateY(-3.5rem);border-radius:var(--radius-xl);padding:var(--space-2xl) var(--space-lg);box-shadow:var(--shadow-md)}
        .form-label{display:block;font-size:14px;font-weight:500;color:var(--text-dark);margin-bottom:var(--space-md);font-family:'Noto Sans Bengali',sans-serif;line-height:20px}
        .phone-input-wrapper{display:flex;gap:var(--space-md);margin-bottom:var(--space-lg)}
        .country-select{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-md) var(--space-lg);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);font-size:16px;color:var(--text-dark);cursor:pointer;min-width:90px}
        .country-flag{font-size:24px;line-height:1}
        .phone-input{flex:1;padding:var(--space-md) var(--space-lg);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);font-size:16px;color:var(--text-dark);font-family:inherit}
        .phone-input:focus{outline:none;border-color:var(--primary);background:var(--white)}
        .security-badge{display:flex;align-items:center;justify-content:center;gap:var(--space-sm);padding:var(--space-md)}
        .security-badge-icon{color:var(--success);flex-shrink:0}
        .security-badge-text{font-size:12px;color:var(--text-body);line-height:1.4;font-family:'Noto Sans Bengali',sans-serif}
        .btn{width:100%;padding:var(--space-lg) var(--space-xl);font-size:14px;font-weight:500;line-height:20px;letter-spacing:-0.265174px;color:var(--white);background:var(--button-primary);border:none;border-radius:var(--radius-md);cursor:pointer;font-family:'Noto Sans Bengali',sans-serif;transition:background 0.2s;min-height:52px}
        .btn:active{background:var(--button-hover);transform:scale(0.98)}

        /* Footer */
        .footer{text-align:center;padding:var(--space-xl) var(--space-md);font-size:12px;color:var(--text-muted);font-family:'Noto Sans Bengali',sans-serif;line-height:18px}

        /* Error State */
        .ad-error{padding:var(--space-xl);text-align:center;color:var(--error);font-size:13px}

        /* Transitions & Animations */
        .ad-card{transition:opacity 0.3s ease-in-out}
        .ad-card.active{opacity:1;animation:fadeIn 0.3s ease-in-out}
        @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
        .btn,.ad-cta,.dot{transition:all 0.2s ease}
        .btn:hover,.ad-cta:hover{transform:translateY(-1px)}

        /* Touch targets - ensure minimum 44x44px */
        @media(pointer:coarse){
            .btn,.ad-cta{min-height:48px;padding:var(--space-lg) var(--space-xl)}
            .dot{width:32px;height:6px;min-width:32px;min-height:32px;padding:var(--space-md) 0}
            .country-select,.phone-input{min-height:48px}
        }

        /* Responsive */
        @media(max-width:360px){
            .hero-title{font-size:24px;line-height:28px}
            .hero-sub{font-size:14px;line-height:20px}
            .ad-image{height:180px}
            .header h1{font-size:24px;line-height:28px}
            .phone-input-wrapper{flex-direction:column}
            .country-select{width:100%}
            .ad-body{padding:var(--space-md)}
            .form-card{padding:var(--space-lg)}
        }
        @media(min-width:361px) and (max-width:480px){
            .ad-image{height:200px}
        }
        @media(min-width:481px){
            .main{max-width:440px;margin-left:auto;margin-right:auto}
            .ad-image{height:240px}
        }

        /* Improve focus states for accessibility */
        .phone-input:focus,.country-select:focus,.btn:focus,.ad-cta:focus{
            outline:2px solid var(--primary);
            outline-offset:2px
        }

        /* Smooth scrolling */
        html{scroll-behavior:smooth}

        /* Safe area insets for notched devices */
        @supports(padding:env(safe-area-inset-bottom)){
            body{padding-bottom:env(safe-area-inset-bottom)}
        }
    </style>
</head>
<body>

        <section class="top-section">

    <script>
    (function() {
        'use strict';

        // ============================================
        // CONFIGURATION
        // ============================================
        var CONFIG = {
            // KahfAds Native API
            adEndpoint: 'https://ad.kahfads.com/ads-api-native?key=df3b7c12283207cb8bcd05587504f431&native_bs=1',

            // Timeouts (aggressive for captive portals)
            adTimeout: 4000,
            beaconTimeout: 2000,

            // Retry
            maxRetries: 1,

            // Number of ads to fetch (multiple requests)
            maxAds: 3,

            // Carousel rotation interval
            rotationInterval: 4000,

            // Fallback ad
            fallbackAd: {
                title: 'Poptar WiFi',
                description: 'দ্রুত ও নিরাপদ ইন্টারনেট সার্ভিস',
                icon: '📶'
            }
        };

        // ============================================
        // STATE
        // ============================================
        var state = {
            ads: [],
            currentIndex: 0,
            impressionsFired: {},  // Track fired impressions by ad ID
            rotationTimer: null
        };

        // ============================================
        // DOM REFERENCES
        // ============================================
        var $adContainer = document.getElementById('ad-container');
        var $adLoading = document.getElementById('ad-loading');
        var $dots = document.getElementById('dots');

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================

        /**
         * Safe JSON parse
         */
        function safeJsonParse(str) {
            try {
                return JSON.parse(str);
            } catch (e) {
                return null;
            }
        }

        /**
         * Fire beacon via Image (most reliable in captive portals)
         * Returns a promise that resolves when beacon is sent
         */
        function fireBeacon(url, timeout) {
            if (!url) return Promise.resolve();

            timeout = timeout || CONFIG.beaconTimeout;

            return new Promise(function(resolve) {
                var img = new Image();
                var resolved = false;

                function done() {
                    if (!resolved) {
                        resolved = true;
                        resolve();
                    }
                }

                img.onload = done;
                img.onerror = done;  // Fire even on error (beacon sent)

                // Timeout fallback
                setTimeout(done, timeout);

                // Add cache buster
                var separator = url.indexOf('?') > -1 ? '&' : '?';
                img.src = url + separator + '_cb=' + Date.now();
            });
        }

        /**
         * Fetch with timeout (XMLHttpRequest for wider compatibility)
         */
        function fetchWithTimeout(url, options, timeout) {
            timeout = timeout || CONFIG.adTimeout;
            options = options || {};

            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                var timeoutId;

                xhr.open(options.method || 'GET', url, true);

                // Set headers
                if (options.headers) {
                    Object.keys(options.headers).forEach(function(key) {
                        xhr.setRequestHeader(key, options.headers[key]);
                    });
                }

                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        clearTimeout(timeoutId);
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve({
                                ok: true,
                                status: xhr.status,
                                json: function() {
                                    return Promise.resolve(safeJsonParse(xhr.responseText));
                                },
                                text: function() {
                                    return Promise.resolve(xhr.responseText);
                                }
                            });
                        } else {
                            reject(new Error('HTTP ' + xhr.status));
                        }
                    }
                };

                xhr.onerror = function() {
                    clearTimeout(timeoutId);
                    reject(new Error('Network error'));
                };

                timeoutId = setTimeout(function() {
                    xhr.abort();
                    reject(new Error('Timeout'));
                }, timeout);

                xhr.send(options.body || null);
            });
        }

        /**
         * Escape HTML to prevent XSS
         */
        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================
        // AD FETCHING
        // ============================================

        /**
         * Transform KahfAds response to standard format
         */
        function transformKahfAd(data) {
            if (!data || !data.title) return null;

            var impressionUrl = '';
            if (data.beacons && data.beacons.length > 0) {
                for (var i = 0; i < data.beacons.length; i++) {
                    if (data.beacons[i].type === 'impression') {
                        impressionUrl = data.beacons[i].url;
                        break;
                    }
                }
            }

            return {
                id: String(data.bannerId || Date.now()),
                title: data.title || '',
                description: data.description || '',
                imageUrl: (data.images && data.images[0]) ? data.images[0].url : '',
                iconUrl: (data.icons && data.icons[0]) ? data.icons[0].url : '',
                clickUrl: data.clickUrl || '#',
                impressionUrl: impressionUrl,
                ctaText: data.ctaText || 'Learn More',
                advertiser: data.advertiser || ''
            };
        }

        /**
         * Fetch single ad from KahfAds API
         */
        function fetchSingleAd() {
            return fetchWithTimeout(CONFIG.adEndpoint, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            }, CONFIG.adTimeout)
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                return transformKahfAd(data);
            })
            .catch(function(error) {
                console.warn('[AdFetch] Error:', error.message);
                return null;
            });
        }

        /**
         * Fetch multiple ads (makes multiple API calls)
         */
        function fetchAds() {
            var promises = [];
            for (var i = 0; i < CONFIG.maxAds; i++) {
                promises.push(fetchSingleAd());
            }

            return Promise.all(promises).then(function(results) {
                // Filter out nulls and duplicates
                var ads = [];
                var seenIds = {};
                results.forEach(function(ad) {
                    if (ad && !seenIds[ad.id]) {
                        seenIds[ad.id] = true;
                        ads.push(ad);
                    }
                });
                return ads;
            });
        }

        // ============================================
        // AD RENDERING
        // ============================================

        /**
         * Render a single ad card
         */
        function renderAdCard(ad, index) {
            var isActive = index === 0 ? ' active' : '';
            var html = '';

            html += '<div class="ad-card' + isActive + '" ';
            html += 'data-ad-id="' + escapeHtml(ad.id) + '" ';
            html += 'data-index="' + index + '">';

            // Main ad image with badge
            html += '<div style="position:relative;">';
            html += '<img class="ad-image" ';
            html += 'src="' + escapeHtml(ad.imageUrl) + '" ';
            html += 'alt="' + escapeHtml(ad.title) + '" ';
            html += 'loading="lazy" ';
            html += 'onerror="this.style.display=\'none\'">';
            html += '<div class="ad-badge">AD</div>';
            html += '</div>';

            // Ad body
            html += '<div class="ad-body">';

            // Header with logo and brand
            html += '<div class="ad-header">';
            if (ad.iconUrl) {
                html += '<img class="ad-logo" ';
                html += 'src="' + escapeHtml(ad.iconUrl) + '" ';
                html += 'alt="' + escapeHtml(ad.title) + ' logo" ';
                html += 'onerror="this.style.display=\'none\'">';
            }
            html += '<div class="ad-brand">';
            html += '<div class="ad-title">' + escapeHtml(ad.title) + '</div>';
            html += '<div class="ad-sponsor">Sponsored | ' + escapeHtml(ad.advertiser || ad.title) + '</div>';
            html += '</div>';
            html += '</div>';

            // Description
            if (ad.description) {
                html += '<div class="ad-desc">' + escapeHtml(ad.description) + '</div>';
            }

            // CTA Button as link
            html += '<a href="' + escapeHtml(ad.clickUrl) + '" ';
            html += 'target="_blank" rel="noopener" ';
            html += 'class="ad-cta" ';
            html += 'onclick="return handleAdClick(this, event, \'' + escapeHtml(ad.id) + '\')">';
            html += escapeHtml(ad.ctaText || 'Learn More');
            html += '</a>';

            html += '</div>';
            html += '</div>';

            return html;
        }

        /**
         * Render fallback ad (house ad)
         */
        function renderFallbackAd() {
            var html = '<div class="ad-fallback">';
            html += '<div class="ad-fallback-icon">' + CONFIG.fallbackAd.icon + '</div>';
            html += '<div class="ad-fallback-title">' + escapeHtml(CONFIG.fallbackAd.title) + '</div>';
            html += '<div class="ad-fallback-desc">' + escapeHtml(CONFIG.fallbackAd.description) + '</div>';
            html += '</div>';
            return html;
        }

        /**
         * Render carousel dots
         */
        function renderDots(count) {
            if (count <= 1) {
                $dots.style.display = 'none';
                return;
            }

            var html = '';
            for (var i = 0; i < count; i++) {
                html += '<span class="dot' + (i === 0 ? ' active' : '') + '" data-index="' + i + '"></span>';
            }
            $dots.innerHTML = html;
            $dots.style.display = 'flex';

            // Add click handlers to dots
            var dots = $dots.querySelectorAll('.dot');
            for (var j = 0; j < dots.length; j++) {
                dots[j].addEventListener('click', function() {
                    showAd(parseInt(this.getAttribute('data-index'), 10));
                });
            }
        }

        /**
         * Show specific ad by index
         */
        function showAd(index) {
            if (state.ads.length === 0) return;

            state.currentIndex = index;

            // Update ad cards
            var cards = $adContainer.querySelectorAll('.ad-card');
            for (var i = 0; i < cards.length; i++) {
                if (i === index) {
                    cards[i].classList.add('active');
                    cards[i].style.display = 'block';
                } else {
                    cards[i].classList.remove('active');
                    cards[i].style.display = 'none';
                }
            }

            // Update dots
            var dots = $dots.querySelectorAll('.dot');
            for (var j = 0; j < dots.length; j++) {
                if (j === index) {
                    dots[j].classList.add('active');
                } else {
                    dots[j].classList.remove('active');
                }
            }

            // Fire impression for this ad
            fireImpressionBeacon(state.ads[index]);
        }

        /**
         * Rotate to next ad
         */
        function rotateAd() {
            var nextIndex = (state.currentIndex + 1) % state.ads.length;
            showAd(nextIndex);
        }

        /**
         * Start auto-rotation
         */
        function startRotation() {
            if (state.ads.length <= 1) return;

            state.rotationTimer = setInterval(rotateAd, CONFIG.rotationInterval);
        }

        /**
         * Stop auto-rotation
         */
        function stopRotation() {
            if (state.rotationTimer) {
                clearInterval(state.rotationTimer);
                state.rotationTimer = null;
            }
        }

        // ============================================
        // IMPRESSION TRACKING
        // ============================================

        /**
         * Fire impression beacon (once per ad per page load)
         */
        function fireImpressionBeacon(ad) {
            if (!ad || !ad.id) return;

            // Check if already fired
            if (state.impressionsFired[ad.id]) {
                return;
            }

            // Mark as fired immediately (before async operation)
            state.impressionsFired[ad.id] = true;

            // Fire beacon
            if (ad.impressionUrl) {
                fireBeacon(ad.impressionUrl).then(function() {
                    console.log('[Impression] Fired for ad:', ad.id);
                });
            }
        }

        // ============================================
        // CLICK HANDLING
        // ============================================

        /**
         * Handle ad click - exposed globally for onclick
         */
        window.handleAdClick = function(element, event, adId) {
            // Get ad ID from parameter or element data attribute
            var id = adId || element.getAttribute('data-ad-id');
            var clickUrl = element.getAttribute('href');

            console.log('[Click] Ad clicked:', id);

            // Let the browser handle the navigation
            // The href already points to the tracking clickUrl
            // which will redirect to the final destination

            // For captive portals that don't support target="_blank"
            // we still return true to allow navigation
            return true;
        };

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            console.log('[CaptivePortal] Initializing...');

            // Fetch ads
            fetchAds()
                .then(function(ads) {
                    // Hide loading
                    $adLoading.style.display = 'none';

                    if (ads.length === 0) {
                        // Show fallback
                        $adContainer.innerHTML = renderFallbackAd();
                        $dots.style.display = 'none';
                        console.log('[CaptivePortal] Showing fallback ad');
                        return;
                    }

                    // Store ads
                    state.ads = ads;

                    // Render ad cards
                    var html = '';
                    for (var i = 0; i < ads.length; i++) {
                        html += renderAdCard(ads[i], i);
                    }
                    $adContainer.innerHTML = html;

                    // Render dots
                    renderDots(ads.length);

                    // Fire first impression
                    fireImpressionBeacon(ads[0]);

                    // Start rotation
                    startRotation();

                    console.log('[CaptivePortal] Loaded', ads.length, 'ads');
                })
                .catch(function(error) {
                    console.error('[CaptivePortal] Fatal error:', error);
                    $adLoading.style.display = 'none';
                    $adContainer.innerHTML = renderFallbackAd();
                });
        }

        // ============================================
        // CAPTIVE PORTAL QUIRKS HANDLING
        // ============================================

        // iOS CNA: Detect if we're in the captive network assistant
        var isIOSCNA = /CaptiveNetworkSupport|wifiportal/i.test(navigator.userAgent);

        // Android: Detect captive portal browser
        var isAndroidCaptive = /Android.*wv/i.test(navigator.userAgent);

        // Adjust behavior for captive browsers
        if (isIOSCNA || isAndroidCaptive) {
            // Reduce timeout for faster feedback
            CONFIG.adTimeout = 2000;
            CONFIG.beaconTimeout = 1500;

            // Simpler animation
            document.documentElement.style.setProperty('--animation-duration', '0.3s');
        }

        // ============================================
        // START
        // ============================================

        // Start immediately (don't wait for DOMContentLoaded - already at bottom)
        init();

    })();
    </script>
</body>
</html>
